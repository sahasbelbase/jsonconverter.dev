<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3b82f6" />
  <title>Dev Tools — JSON Converter, Formatter, Tokenizer &amp; More</title>
  <meta name="description"
    content="Free developer tools that run entirely in your browser: JSON to Excel/CSV, formatter, diff viewer, JWT decoder, token counter, Base64, hashing and more." />
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- The theme is applied before first paint so a dark-mode user never sees a white flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* localStorage unavailable; fall back to light */ }
    })();
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZZM7HXZZDE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    // Page views are sent by AnalyticsTracker on every route change, so the initial
    // config must not send one of its own.
    gtag('config', 'G-ZZM7HXZZDE', { send_page_view: false });
  </script>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4378496741687724"
    crossorigin="anonymous"></script>
</head>
